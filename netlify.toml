[build]
  # No --minify: zen theme JSON-LD has trailing commas that break Hugo's minifier.
  command = "hugo --gc"
  publish = "public"

[build.environment]
  HUGO_VERSION = "0.88.1"
  HUGO_ENV = "production"
  HUGO_ENABLEGITINFO = "true"

[context.deploy-preview]
  command = "hugo --gc -b $DEPLOY_PRIME_URL"

[context.branch-deploy]
  command = "hugo --gc -b $DEPLOY_PRIME_URL"
