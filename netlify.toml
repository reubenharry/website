[build]
  # Build locally with ./build.sh (requires GHC + cabal), then push.
  # Netlify publishes the prebuilt public/ directory.
  command = "test -f public/index.html"
  publish = "public"

[build.environment]
  NODE_VERSION = "18"

[context.deploy-preview]
  command = "test -f public/index.html"

[context.branch-deploy]
  command = "test -f public/index.html"
